name: Run V2ray Bot

on:
  push:
    paths:
      - '.github/workflows/run.yml'
  schedule:
    - cron: '25 * * * *'   # هر ۱ ساعت، دقیقه ۲۵
  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping runs from racing while saving memory files.
concurrency:
  group: proxy-bot-main
  cancel-in-progress: false

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests jdatetime pytz beautifulsoup4

      - name: Run Bot
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Save memory files safely
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add goololgoo.txt sent_ips.txt
          if git diff --cached --quiet; then
            echo "No memory-file changes to commit."
            exit 0
          fi

          git commit -m "Update goololgoo and sent_ips"

          # Rebase the memory-file commit onto the latest main before pushing.
          # The workflow concurrency lock prevents another scheduled run racing this step.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict while saving memory files."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Memory files saved successfully."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep 2
          done

          echo "Could not push memory files after 3 attempts."
          exit 1
